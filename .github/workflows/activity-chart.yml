
name: Update contribution chart

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity-assets
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate custom purple line chart
        run: node .github/scripts/generate-line-chart.mjs
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}

      
      - name: Prepare interactive weekly chart
        run: |
          mkdir -p activity-dist
          cp .github/scripts/weekly-chart.html activity-dist/index.html

      - name: Publish chart to activity-assets branch
        shell: bash
        env:
          TARGET_BRANCH: activity-assets
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          parent="$(mktemp -d)"
          worktree="$parent/working"

          trap 'git worktree remove -f "$worktree" >/dev/null 2>&1 || true; rm -rf "$parent"' EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git_auth=(-c credential.helper= -c credential.helper='!gh auth git-credential')

          if git "${git_auth[@]}" ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null; then
            git "${git_auth[@]}" fetch --no-tags origin "$TARGET_BRANCH"
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            rc=$?
            if [[ "$rc" -ne 2 ]]; then
              echo "Unable to check remote assets branch; aborting." >&2
              exit "$rc"
            fi

            git worktree add --detach "$worktree" HEAD
            git -C "$worktree" switch --orphan "$TARGET_BRANCH"
          fi

          # Avoid publishing a new commit when the generated chart is unchanged.
          if [[ -f "$worktree/activity-line.svg" ]] &&
             cmp -s "$worktree/activity-line.svg" "$GITHUB_WORKSPACE/activity-dist/activity-line.svg"; then
            echo "Chart is unchanged; no new commit required."
            exit 0
          fi

          # The activity-assets branch is reserved for generated chart assets.
          git -C "$worktree" rm -r --ignore-unmatch . >/dev/null
          find "$worktree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a "$GITHUB_WORKSPACE/activity-dist/." "$worktree/"

          git -C "$worktree" add -A

          if git -C "$worktree" diff --cached --quiet; then
            echo "No changes in published assets."
            exit 0
          fi

          git -C "$worktree" commit -m "chore: refresh contribution line chart"
          git -C "$worktree" "${git_auth[@]}" push origin "HEAD:refs/heads/$TARGET_BRANCH"
